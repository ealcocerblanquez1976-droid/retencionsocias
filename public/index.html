<script>
(function(){
const TEAM=["Susana","Manoli","Viviana","Eva"];
const CODES=[
 {k:"VUELVE",t:"Vuelve",d:"Da fecha concreta para venir",fecha:"req",fl:"Día que viene"},
 {k:"SIN RESPUESTA",t:"Sin respuesta",d:"No coge; WhatsApp enviado",fecha:"no"},
 {k:"SIN FECHA",t:"Contesta sin fecha",d:"Tiempo, ánimo… no concreta",fecha:"opt",fl:"Día de seguimiento (opcional)"},
 {k:"SALUD",t:"Salud",d:"Lesión, enfermedad o cuidar a un familiar",fecha:"opt",fl:"Revisar el día"},
 {k:"FUERA",t:"Fuera",d:"Viaje o vacaciones",fecha:"req",fl:"Día que vuelve"},
 {k:"RIESGO BAJA",t:"Riesgo de baja",d:"Habla de dejarlo o de dinero",fecha:"no"},
 {k:"ESCALAR",t:"Pasar a Eva",d:"Cualquier otro caso delicado",fecha:"no"},
 {k:"BAJA DEFINITIVA",t:"Cursar baja definitiva",d:"Quiere darse de baja: infórmale de cómo tramitarla",fecha:"opt",fl:"Seguimiento el día",soloEva:true}
];
const CANALES=["Llamada","WhatsApp","En persona"];
const NOTA_MAX=200;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>iso(new Date());
const fmt=s=>{if(!s)return "";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m;};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
function addWorkdays(s,n){const d=parseISO(s);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++;}return iso(d);}
function nextWorkdayFrom(s){const d=parseISO(s);d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return iso(d);}
function diasSin(s){return s.ultEntreno?daysBetween(s.ultEntreno,today()):s.dias||0;}
// Reglas MIA (Eva, 09/11/2026): se gestionan desde 6 días sin venir. 6-15 Susana, 16-30 Manoli, 31+ Eva.
const MIN_DIAS=6;
function tramoOf(d){return d<=15?"6-15":d<=30?"16-30":"31+";}
function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
function desdeGestion(s){return addDaysISO(s.ultEntreno,MIN_DIAS);} // primer día en que entra en la lista
// Ausencias: hasta esa fecha (sin incluir) sus MIA las lleva Eva
const AUSENCIAS={Viviana:"2026-11-27"}; // 18/11 noche: Susana y Manoli vuelven a llevar sus MIA (Eva, 18/11/2026)
function presente(w){return w&&AUSENCIAS[w]&&today()<AUSENCIAS[w]?"Eva":w;}
function ownerBase(s){if(s.ownerManual)return s.ownerManual;const d=diasSin(s);if(d<=15)return "Susana";if(d<=30)return "Manoli";return "Eva";}
function ownerOf(s){const w=ownerBase(s);return AUSENCIAS[w]&&today()<AUSENCIAS[w]?"Eva":w;}
function nombreCorto(n){const p=String(n||"").trim().split(/\s+/)[0]||"";return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase();}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

let me=presente(lsGet("mia.me")||"");
let mensajes={}, msgEdits={}, msgSent={}; let socias=[], gestiones=[], estado=null, db=null, snap=null, casos={}, vueltas=[], informes=[], openForm=null, filtro={q:"",owner:"",tramo:"",cod:""};
// Red de seguridad (Eva, 12/11/2026): respuestas de WhatsApp de cualquier socia que suenan a riesgo de baja
let riesgos=[];
let buscar=""; const nrm=x=>String(x??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let ready={s:false,g:false}; let pendingRender=false;
// Respuesta sugerida por Claude a lo que contesta la socia (Eva, 11/11/2026)
let sampleFn=null; const resp={}, sugg={}, sugSt={};
// Idioma de los mensajes: castellano o catalán (Eva, 11/11/2026)
let lang=lsGet("mia.lang")==="ca"?"ca":"es", trAll=false;
function paintLang(){document.querySelectorAll(".chip[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));}
document.querySelectorAll(".chip[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;lsSet("mia.lang",lang);paintLang();render();}));
paintLang();
function promptTr(textos,to){
  return `Traduce cada mensaje de WhatsApp al ${to==="ca"?"catalán (catalán central, natural y cercano, como se habla en Sant Cugat)":"castellano (español de España, natural y cercano)"}. Son mensajes de una entrenadora de un club de fitness para mujeres a sus socias. Mantén el tono, el sentido y la longitud; no añadas ni quites nada, sin emojis. No traduzcas los nombres propios. Si aparece el marcador {yo}, déjalo exactamente igual. Si un mensaje ya está en ese idioma, devuélvelo igual.

Responde SOLO con un objeto JSON con las mismas claves y el texto traducido como valor.

${JSON.stringify(textos)}`;
}
function sinCa(list){const seen=new Set();return list.filter(s=>{const k=s.num+"-"+s.ultEntreno;const m=mensajes[k];if(!m||m.textoCa||seen.has(k)||msgEdits[s.num]!=null)return false;if(s.mismoCaso&&["SIN RESPUESTA","VUELVE","SIN FECHA","SALUD","FUERA"].includes(s.ultGestionApp?.codigo)&&!respuesta(s))return false;seen.add(k);return true;});}
async function traducirCard(num,to,btn){
  const s=socias.find(x=>x.num===num), t=document.getElementById("m"+num);
  if(!s||!t||!sampleFn) return; const txt=t.value.trim(); if(!txt) return;
  const old=btn.textContent; btn.disabled=true; btn.textContent="Traduciendo…";
  try{
    const r=await sampleFn.json(promptTr({m:txt},to),{modelTier:"quick"});
    const out=String(r?.m||"").trim(); if(!out) throw {code:"empty_completion"};
    msgEdits[num]=out; if(sugg[num]) sugg[num].respuesta=out;
    t.value=out; const a=document.querySelector(`[data-wa="${num}"]`); if(a) a.href=waHref(s,out);
    if(msgSent[num]!=null) msgSent[num]=out;
    toast(to==="ca"?"Missatge en català":"Mensaje en castellano");
  }catch(e){toast(e&&e.code==="rate_limited"?"Demasiadas peticiones: espera un minuto":"No he podido traducirlo. Vuelve a probar.");}
  btn.disabled=false; btn.textContent=old;
}
async function traducirTodos(){
  if(!sampleFn||trAll) return;
  const lista=sinCa(socias.filter(s=>isMine(s,me))); if(!lista.length) return;
  trAll=true; render();
  let hechos=0, fallo=false;
  for(let i=0;i<lista.length;i+=25){
    const trozo=lista.slice(i,i+25), textos={};
    trozo.forEach(s=>{const k=s.num+"-"+s.ultEntreno;textos[k]=mensajes[k].texto;});
    try{
      const r=await sampleFn.json(promptTr(textos,"ca"),{modelTier:"quick"});
      for(const k of Object.keys(textos)){
        const v=String(r?.[k]||"").trim(); if(!v) continue;
        mensajes[k]={...mensajes[k],textoCa:v}; hechos++;
        if(db){try{await db.doc("mensajes/"+k).update({textoCa:v});}catch(er){}}
      }
    }catch(e){fallo=true;break;}
  }
  trAll=false; render();
  toast(fallo?`Traducidos ${hechos}. El resto no se ha podido: vuelve a pulsar.`:`${hechos} mensajes pasados al català`);

async function sugerir(num){
  const s=socias.find(x=>x.num===num); const txt=(s?respTexto(s):"").trim();
  if(!s||!sampleFn) return;

  if(!me){toast("Primero elige quién eres arriba");return;}
  sugSt[num]={st:"busy",msg:"Pensando la respuesta…"}; paintSug(num);
  try{
    const r=await sampleFn.json(promptSug(s,txt),{modelTier:"quick",cache:false});
    const respuesta=String(r?.respuesta||"").trim();
    if(!respuesta) throw {code:"empty_completion"};
    const ok=CODES.some(c=>c.k===r.codigo&&c.k!=="SIN RESPUESTA"&&(!c.soloEva||esDeEva(s)));
    let fecha=/^\d{4}-\d{2}-\d{2}$/.test(r?.fecha||"")&&r.fecha>=today()?r.fecha:"";
    if(fecha&&esFinde(fecha)) fecha=nextWorkdayFrom(addDaysISO(fecha,-1)); // sábado/domingo cerrado: pasa al lunes
    sugg[num]={respuesta,codigo:ok?r.codigo:"",fecha,nota:String(r?.nota||"").slice(0,NOTA_MAX)};
    msgEdits[num]=respuesta;
    const t=document.getElementById("m"+num); if(t) t.value=respuesta;
    const a=document.querySelector(`[data-wa="${num}"]`); if(a) a.href=waHref(s,respuesta);
    const c=CODES.find(c=>c.k===sugg[num].codigo);
    sugSt[num]={st:"ok",msg:`Respuesta lista en la caja de WhatsApp: revísala y pulsa <b>Abrir en WhatsApp</b>. Resultado propuesto: <b>${esc(c?c.t:"elígelo tú")}${fecha?" "+esc(fmt(fecha)):""}</b>. Después pulsa <b>Registrar gestión</b> (ya va rellenado).`};
  }catch(e){
    const code=e&&e.code;
    if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"){sampleFn=null;sugSt[num]={st:"err",msg:"No tengo permiso para usar Claude en esta página. Escribe tú la respuesta."};}
    else if(code==="rate_limited") sugSt[num]={st:"err",msg:"Demasiadas peticiones seguidas. Espera un minuto y vuelve a pulsar."};
    else sugSt[num]={st:"err",msg:"No he podido sugerir la respuesta. Vuelve a pulsar o escríbela tú."};
  }
  paintSug(num);
}

function etiqueta(codigo,fechaRef,prox){const f=fechaRef||prox;return f?`${codigo} ${fmt(f)}`:codigo;}
function oseText(s,g){
  const prox=g.prox?`Próx ${fmt(g.prox)}`:"Próx -";
  const wa=g.mensaje?` | WhatsApp enviado: «${String(g.mensaje).replace(/\s+/g," ").trim()}»`:"";
  return `MIA | ${g.tramo}d | ${etiqueta(g.codigo,g.fechaRef,g.prox)} | ${g.por} | ${g.canal} | ${prox} | ${g.nota||"-"}${wa}`;
}
function mensajeEnviado(s,canal){
  if(msgSent[s.num]) return msgSent[s.num];
  if(canal!=="WhatsApp") return "";
  const t=document.getElementById("m"+s.num); return t?t.value.trim():"";
}
function esDeEva(s){return !!s.escalada||ownerOf(s)==="Eva";}
function mesesEntre(a,b){if(!a)return null;const x=parseISO(a),y=parseISO(b);let m=(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth());if(y.getDate()<x.getDate())m--;return Math.max(0,m);}
function fmtL(s){if(!s)return "—";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y;}
function mesTxt(n){return n===null?"":n===1?"1 mes":n+" meses";}
// Baja anticipada del pack de 12 meses: regularización de 11 € por mes disfrutado (Eva).
// Meses disfrutados = recibos ya pasados desde el inicio de la oferta (hasta el próximo recibo; si no hay, hasta hoy contando el mes en curso).
// Regularización por mes disfrutado según la cuota (Eva, 10/11/2026): 69 € → 16 €; resto → 11 €
const REG_MES=11; const REG_POR_CUOTA={69:16};
function regMes(c){const q=cuotaNum(c);return REG_POR_CUOTA[q]??REG_MES;}
function regularizacion(c){
  if(!c||!/12/.test(c.oferta||"")||!c.inicioOferta) return null;
  let m=c.proximoPago&&c.proximoPago>c.inicioOferta?mesesEntre(c.inicioOferta,c.proximoPago):mesesEntre(c.inicioOferta,today())+1;
  if(m>=12) return {meses:m,importe:0,cumplido:true};
  m=Math.max(1,m); return {meses:m,importe:m*regMes(c),cumplido:false};
}
function regTxt(c){const r=regularizacion(c);if(!r)return "No es pack de 12 meses: sin regularización";if(r.cumplido)return "Ya ha cumplido los 12 meses: sin regularización";return `${r.meses} ${r.meses===1?"mes disfrutado":"meses disfrutados"} × ${regMes(c)} € = ${r.importe} € a abonar`;}
// Baja: aviso por escrito con 15 días de antelación al próximo recibo (contrato, tarifa con domiciliación)
const PREAVISO=15;
function eur(n){return (Math.round(n*100)/100).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";}
function cuotaNum(c){return parseFloat(String(c?.importe||"0").replace(/\./g,"").replace(",","."))||0;}
function addMonthsISO(s,n){const d=parseISO(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);}
// Escenarios económicos para tramitar la baja
function escenarios(c){
  const t=today(), cuota=cuotaNum(c), pack=/12/.test(c.oferta||"")&&!!c.inicioOferta;
  let rec=c.proximoPago||""; while(rec&&rec<=t) rec=addMonthsISO(rec,1); // próximo recibo pendiente
  if(!rec) return null;
  const limite=addDaysISO(rec,-PREAVISO), aTiempo=t<=limite;
  const recBaja=aTiempo?rec:addMonthsISO(rec,1); // primer recibo que ya no se cobra
  const recibosAntes=aTiempo?0:1; // recibos que aún pagará si avisa hoy
  const res={rec,limite,aTiempo,recBaja,cuota,pack};
  if(!pack){res.hoy={coste:recibosAntes*cuota,txt:`Sin regularización (no es pack de 12 meses).${recibosAntes?` Paga el recibo del ${fmtL(rec)}.`:""}`};res.mejor="hoy";return res;}
  const mHoy=Math.max(1,mesesEntre(c.inicioOferta,recBaja)); // meses disfrutados hasta la baja efectiva
  const cumple=addMonthsISO(c.inicioOferta,12);
  if(mHoy>=12){res.hoy={coste:recibosAntes*cuota,txt:`Ya cumple los 12 meses: sin regularización.${recibosAntes?` Paga el recibo del ${fmtL(rec)}.`:""}`};res.mejor="hoy";return res;}
  const regHoy=mHoy*regMes(c);
  res.hoy={coste:regHoy+recibosAntes*cuota,meses:mHoy,txt:`Regularización ${mHoy} ${mHoy===1?"mes":"meses"} × ${regMes(c)} € = ${eur(regHoy)}${recibosAntes?` + recibo del ${fmtL(rec)} (${eur(cuota)})`:""}`};
  const pendientes=12-mHoy+recibosAntes; // recibos hasta completar los 12 meses
  res.espera={coste:pendientes*cuota,txt:`Pagar ${pendientes} ${pendientes===1?"recibo":"recibos"} más hasta cumplir 12 meses (${fmtL(cumple)}), sin regularización, y avisar antes del ${fmtL(addDaysISO(cumple,-PREAVISO))}`};
  res.mejor=res.hoy.coste<=res.espera.coste?"hoy":"espera";
  return res;
}
// Condiciones leídas de la ficha de OSE (solo MIA de Eva): para informar de cómo tramitar la baja
function condHTML(s){
  const c=s.condiciones, t=today();
  if(!c) return `<div class="cond"><span class="h">Condiciones en OSE</span><span class="x">Aún no leídas. Se leen de OSE en la próxima sincronización.</span></div>`;
  const ma=mesesEntre(c.inicioCompromiso,t), mo=mesesEntre(c.inicioOferta,t);
  const e=escenarios(c); const salud=s.mismoCaso&&s.ultGestionApp?.codigo==="SALUD";
  const pre=!e?"—":e.aTiempo?`Si avisa por escrito hasta el ${esc(fmtL(e.limite))}, el recibo del ${esc(fmtL(e.rec))} ya no se cobra`:`Ya no llega a los 15 días para el recibo del ${esc(fmtL(e.rec))} (se cobra). Avisando hoy, la baja es para el recibo del ${esc(fmtL(e.recBaja))}`;
  let rec="—";
  if(e){
    if(!e.espera) rec=`Tramitar la baja ya. Coste: ${esc(eur(e.hoy.coste))}. ${esc(e.hoy.txt)}`;
    else rec=(e.mejor==="hoy"
      ?`<b>Le sale mejor darse de baja ya:</b> ${esc(eur(e.hoy.coste))} (${esc(e.hoy.txt)}). Esperar a cumplir los 12 meses le costaría ${esc(eur(e.espera.coste))}.`
      :`<b>Le sale mejor esperar a cumplir los 12 meses:</b> ${esc(eur(e.espera.coste))} (${esc(e.espera.txt)}). Darse de baja ya le costaría ${esc(eur(e.hoy.coste))} (${esc(e.hoy.txt)}).`);
  }
  return `<div class="cond"><span class="h">Baja definitiva · condiciones en OSE (leído ${esc(fmt(c.leido))})</span>
    <span>Oferta</span><b>${esc(c.oferta||"—")} · ${esc(c.importe||"—")} €/mes</b>
    <span>Meses de alta</span><b>${ma!==null?mesTxt(ma):"—"} (desde ${esc(fmtL(c.inicioCompromiso))})${c.inicioOferta&&c.inicioOferta!==c.inicioCompromiso?` · oferta actual desde ${esc(fmtL(c.inicioOferta))} (${mesTxt(mo)})`:""}</b>
    <span>Regularización</span><b>${e&&e.hoy&&e.hoy.meses?`${e.hoy.meses} meses disfrutados × ${regMes(c)} € = ${esc(eur(e.hoy.meses*regMes(c)))}`:esc(regTxt(c))}</b>
    <span>Preaviso 15 días</span><b>${pre}</b>
    <span>Recomendación</span><b style="font-weight:600">${rec}</b>
    ${e&&e.espera?`<span>Para ahorrarle la regularización</span><b style="font-weight:600">${salud?"<b>Su último motivo fue de salud:</b> ":""}si la baja es por enfermedad o lesión suya, enfermedad o accidente grave de un familiar (hasta 2º grado) o fallecimiento, y lo acredita con certificado médico oficial, no paga regularización ni tiene que avisar con 15 días. También puede pasar la regularización a una amiga que se dé de alta en el club: entonces no la paga ella.</b>`:""}
    <span class="x">Contrato (condiciones generales): 3.f compromiso de 12 mensualidades con descuento; si se da de baja antes, abona los descuentos disfrutados (${regMes(c)} € por mes) y puede transferirlos a una amiga que se dé de alta. 10.a la baja se pide por escrito con 15 días naturales de antelación al inicio de la mensualidad (el día de pago). 10.c-d sin preaviso ni regularización por fuerza mayor acreditada con certificado médico oficial o de defunción. 12 por fuerza mayor también puede pedir suspensión temporal de 1 a 2 meses.</span></div>`;
}
function computeNext(s,codigo,fechaRef){
  const t=today(); let prox=t, escalada=false, intentos=s.intentos||0;
  if(codigo==="SIN RESPUESTA"){intentos+=1;prox=nextWorkdayFrom(t);if(intentos>=3)escalada=true;}
  else intentos=0;
  if(codigo==="VUELVE") prox=nextWorkdayFrom(fechaRef);
  if(codigo==="FUERA") prox=nextWorkdayFrom(fechaRef);
  if(codigo==="SALUD") prox=fechaRef?fechaRef:addWorkdays(t,5);
  if(codigo==="SIN FECHA") prox=fechaRef?fechaRef:addWorkdays(t,2);
  if(codigo==="RIESGO BAJA"||codigo==="ESCALAR"){escalada=true;prox=t;}
  if(codigo==="BAJA DEFINITIVA"){escalada=true;prox=fechaRef||addWorkdays(t,5);}
  return {prox,escalada,intentos};
}

function viewTodas(){
  const q=filtro.q.trim().toLowerCase();
  let rows=socias.filter(s=>contactable(s));
  if(q) rows=rows.filter(s=>String(s.nombre).toLowerCase().includes(q)||String(s.num)===q);
  if(filtro.owner) rows=rows.filter(s=>(s.escalada?"Eva":ownerOf(s))===filtro.owner);
  if(filtro.tramo) rows=rows.filter(s=>tramoOf(diasSin(s))===filtro.tramo);
  if(filtro.cod) rows=rows.filter(s=>(s.ultGestionApp?.codigo||"SIN GESTIÓN")===filtro.cod);
  rows.sort((a,b)=>diasSin(a)-diasSin(b));

function kpis(){
  const t=today(); const cur=socias.filter(x=>x.estado!=="excluida"&&!x.nc&&!x.pb&&diasSin(x)>=MIN_DIAS);
  // 1) Contactadas en 48 h: casos abiertos en los últimos 21 días que ya han cumplido 2 días hábiles
  const k1=cur.map(x=>[x.abiertaDesde>desdeGestion(x)?x.abiertaDesde:desdeGestion(x),x.primeraGestion]).concat(vueltas.map(v=>[v.abiertaDesde,v.primeraGestion]))
    .filter(([a])=>a&&daysBetween(a,t)<=21&&addWorkdays(a,2)<=t);
  const aTiempo=k1.filter(([a,p])=>p&&p<=addWorkdays(a,2)).length;
  // 2) Seguimiento al día
  const abiertas=cur; const venc=abiertas.filter(x=>x.prox&&x.prox<t).length;
  // 3) Vuelven en 14 días tras la primera gestión
  const b3=vueltas.filter(v=>v.primeraGestion&&daysBetween(v.primeraGestion,t)<=60);
  const vuelven=b3.filter(v=>daysBetween(v.primeraGestion,v.vueltaFecha)<=14).length;
  const b3open=cur.filter(x=>x.primeraGestion&&daysBetween(x.primeraGestion,t)>=14&&daysBetween(x.primeraGestion,t)<=60).length;
  // 4) Riesgo de baja
  const riesgo=abiertas.filter(x=>x.mismoCaso&&["RIESGO BAJA","BAJA DEFINITIVA"].includes(x.ultGestionApp?.codigo)).length;
  return {ventana:k1.length,aTiempo,abiertas:abiertas.length,venc,base:b3.length+b3open,vuelven,riesgo};
}
// Tasa de éxito MIA (Eva, 10/11/2026): de las socias que han recibido al menos una gestión (primera gestión en los últimos 60 días),
// cuántas han vuelto a entrenar después de esa gestión. Las que siguen sin venir cuentan como pendientes.
const EXITO_DIAS=60;
function exito(w){
  const t=today();
  const vg=vueltas.filter(v=>v.primeraGestion&&daysBetween(v.primeraGestion,t)<=EXITO_DIAS&&v.vueltaFecha>=v.primeraGestion&&(!w||v.por===w));
  const pend=socias.filter(s=>s.mismoCaso&&s.primeraGestion&&s.estado!=="excluida"&&diasSin(s)>=MIN_DIAS&&daysBetween(s.primeraGestion,t)<=EXITO_DIAS&&(!w||(s.ultGestionApp?.por||"")===w));
  const solas=w?0:vueltas.filter(v=>!v.primeraGestion&&daysBetween(v.vueltaFecha,t)<=EXITO_DIAS).length;
  const dias=vg.map(v=>daysBetween(v.primeraGestion,v.vueltaFecha)).sort((a,b)=>a-b);
  const mediana=dias.length?dias[Math.floor((dias.length-1)/2)]:null;
  return {vuelven:vg.length,gestionadas:vg.length+pend.length,pendientes:pend.length,solas,mediana,pct:pct(vg.length,vg.length+pend.length)};
}
function exitoCard(){
  const e=exito();
  return `<div class="kpi hero"><div class="t">Tasa de éxito MIA</div><div class="v">${e.pct===null?"—":e.pct+"%"}</div><div class="bar"><i style="width:${e.pct??0}%"></i></div>
    <div class="sub"><span><b>${e.vuelven}</b> han vuelto tras la gestión</span><span><b>${e.gestionadas}</b> socias gestionadas</span><span><b>${e.pendientes}</b> aún sin volver</span>${e.mediana!==null?`<span>Tardan <b>${e.mediana}</b> días de mediana en volver</span>`:""}</div>
    <div class="d">Socias con su primera gestión en los últimos ${EXITO_DIAS} días que ya han vuelto a entrenar. ${e.solas?`Aparte, ${e.solas} volvieron solas antes de que nadie las gestionara (no cuentan).`:""}</div></div>`;
}
const pct=(a,b)=>b?Math.round(100*a/b):null;
function kpiCard(title,val,desc,target,good){
  const cls=val===null?"":good?"ok":"bad";
  return `<div class="kpi ${cls}"><div class="t">${title}</div><div class="v">${val===null?"—":val+"%"}</div><div class="bar"><i style="width:${val??0}%"></i></div><div class="d">${desc} · objetivo ${target}</div></div>`;
}

});
document.addEventListener("focusout",e=>{if(e.target.dataset&&(e.target.dataset.msg||e.target.dataset.resp)&&pendingRender){pendingRender=false;setTimeout(render,0);}});
document.addEventListener("input",e=>{const rt=e.target.closest&&e.target.closest("[data-resp]");if(rt){resp[rt.dataset.resp]=rt.value;return;}const mt=e.target.closest&&e.target.closest("[data-msg]");if(mt){const num=mt.dataset.msg;msgEdits[num]=mt.value;if(msgSent[num]!=null)msgSent[num]=mt.value.trim();const s=socias.find(x=>x.num===num);const a=document.querySelector(`[data-wa="${num}"]`);if(s&&a)a.href=waHref(s,mt.value);return;}if(e.target.id==="gq"){buscar=e.target.value;openForm=null;clearTimeout(render._g);render._g=setTimeout(render,200);return;}if(e.target.id==="fq"){filtro.q=e.target.value;clearTimeout(render._t);render._t=setTimeout(()=>{render();const i=$("#fq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}});

function wireForm(num){
  const s=socias.find(x=>x.num===num); const f=document.getElementById("f"+num); if(!s||!f) return;
  const id="f"+num; let code=null;
  const sw=$("#"+id+"-segwrap"), seg=$("#"+id+"-seg"); let segTocado=false;
  const nextOf=()=>{const nx=computeNext(s,code,fd.value);if(!sw.hidden&&seg.value)nx.prox=seg.value;return nx;};
  const syncSeg=()=>{sw.hidden=canal.value!=="WhatsApp"||!code||code==="SIN FECHA";if(!sw.hidden&&!segTocado){const p=computeNext(s,code,fd.value).prox;seg.value=p>today()?p:nextWorkdayFrom(today());}};
  seg.addEventListener("input",()=>{segTocado=true;});
  const fw=$("#"+id+"-fwrap"), fl=$("#"+id+"-flabel"), fd=$("#"+id+"-fecha"), nota=$("#"+id+"-nota"), canal=$("#"+id+"-canal"), ose=$("#"+id+"-ose"), err=$("#"+id+"-err");
  // Baja ya tramitada en OSE: cierra el caso al guardar (Eva, 12/11/2026)
  const tw=$("#"+id+"-tramwrap"), tram=$("#"+id+"-tram");
  const cerrar=()=>code==="BAJA DEFINITIVA"&&tram.checked;
  const notaFinal=()=>{const n=nota.value.trim();return cerrar()?("Baja tramitada en OSE, caso cerrado"+(n?". "+n:"")).slice(0,NOTA_MAX):n;};
  const preview=()=>{ if(!code){return;} syncSeg(); const c=CODES.find(c=>c.k===code); const nx=nextOf();
    fw.hidden=c.fecha==="no"||cerrar(); if(cerrar()) sw.hidden=true;
    const g={tramo:tramoOf(diasSin(s)),codigo:code,fechaRef:c.fecha!=="no"&&!cerrar()?fd.value:"",por:me,canal:canal.value,prox:cerrar()?"":nx.prox,nota:notaFinal(),mensaje:mensajeEnviado(s,canal.value)};
    ose.textContent=oseText(s,g); };
  tram.addEventListener("change",preview);
  f.querySelectorAll(".code").forEach(b=>b.addEventListener("click",()=>{
    code=b.dataset.code; f.querySelectorAll(".code").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    tw.hidden=code!=="BAJA DEFINITIVA"; if(tw.hidden) tram.checked=false;
    const c=CODES.find(c=>c.k===code); fw.hidden=c.fecha==="no"; fl.textContent=c.fl||"Fecha"+(c.fecha==="opt"?" (opcional)":"");
    if(code==="SIN RESPUESTA") canal.value="WhatsApp";
    err.hidden=true; preview();}));
  [fd,nota,canal,seg].forEach(el=>el.addEventListener("input",preview));canal.addEventListener("change",preview);
  // Si Claude ha sugerido la respuesta, el formulario sale rellenado (se puede cambiar todo)
  const sp=sugg[num];
  if(sp){canal.value="WhatsApp";if(sp.nota)nota.value=sp.nota;const b=sp.codigo&&f.querySelector(`.code[data-code="${sp.codigo}"]`);if(b){b.click();if(sp.fecha&&!fw.hidden){fd.value=sp.fecha;}}preview();}
  f.addEventListener("submit",async ev=>{
    ev.preventDefault(); err.hidden=true;
    if(!code){err.textContent="Elige un resultado.";err.hidden=false;return;}
    const c=CODES.find(c=>c.k===code);
    if(cerrar()){
      const save=$("#"+id+"-save"); save.disabled=true; save.textContent="Guardando…";
      const now=new Date(); const dia=today();
      const g={num:s.num,nombre:s.nombre,fecha:dia+"T"+pad(now.getHours())+":"+pad(now.getMinutes()),dia,por:me,codigo:code,canal:canal.value,fechaRef:"",nota:notaFinal(),tramo:tramoOf(diasSin(s)),dias:diasSin(s),prox:"",ose:"pendiente",mensaje:mensajeEnviado(s,canal.value),cierra:true};
      g.textoOSE=oseText(s,g);
      try{
        await db.collection("gestiones").add(g);
        await db.doc("socias/"+s.num).set(caseDoc(s,{estado:"excluida",escalada:false,prox:"",intentos:0,primeraGestion:s.primeraGestion||dia,motivoExclusion:"Baja tramitada en OSE",excluidaFecha:dia,excluidaPor:me,ultGestionApp:{dia,hora:g.fecha.slice(11,16),por:me,codigo:code,nota:g.nota,fechaRef:"",prox:""}}));
        delete msgEdits[s.num]; delete msgSent[s.num]; delete resp[s.num]; delete sugg[s.num]; delete sugSt[s.num]; openForm=null; pendingRender=false; toast("Caso cerrado: baja tramitada. Ya no sale en las listas."); build(); render();
      }catch(er){save.disabled=false;save.textContent="Guardar";err.textContent=er&&er.code==="invalid_argument"?"No tienes permiso para guardar. Pide a Eva acceso de colaboradora.":"No se ha guardado ("+(er.code||"error")+"). Vuelve a intentarlo.";err.hidden=false;}
      return;
    }
    if(c.fecha==="req"&&!fd.value){err.textContent="Pon la fecha: es lo que hace que el seguimiento salga solo.";err.hidden=false;return;}
    if(c.fecha!=="no"&&fd.value&&fd.value<today()){err.textContent="La fecha no puede ser anterior a hoy.";err.hidden=false;return;}
    if((c.fecha!=="no"&&fd.value&&esFinde(fd.value))||(!sw.hidden&&seg.value&&esFinde(seg.value))){err.textContent="Sábado y domingo el club está cerrado: elige un día de lunes a viernes.";err.hidden=false;return;}
    if(!sw.hidden&&seg.value&&seg.value<=today()){err.textContent="El seguimiento tiene que ser a partir de mañana.";err.hidden=false;return;}
    const save=$("#"+id+"-save"); save.disabled=true; save.textContent="Guardando…";
    const now=new Date(); const dia=today(); const nx=nextOf();
    const g={num:s.num,nombre:s.nombre,fecha:dia+"T"+pad(now.getHours())+":"+pad(now.getMinutes()),dia,por:me,codigo:code,canal:canal.value,fechaRef:c.fecha!=="no"?(fd.value||""):"",nota:nota.value.trim().slice(0,NOTA_MAX),tramo:tramoOf(diasSin(s)),dias:diasSin(s),prox:nx.prox,ose:"pendiente",mensaje:mensajeEnviado(s,canal.value)};
    g.textoOSE=oseText(s,g);
    try{
      await db.collection("gestiones").add(g);
      await db.doc("socias/"+s.num).set(caseDoc(s,{prox:nx.prox,intentos:nx.intentos,escalada:nx.escalada,primeraGestion:s.primeraGestion||dia,ultGestionApp:{dia,hora:g.fecha.slice(11,16),por:me,codigo:code,nota:g.nota,fechaRef:g.fechaRef,prox:nx.prox}}));
      delete msgEdits[s.num]; delete msgSent[s.num]; delete resp[s.num]; delete sugg[s.num]; delete sugSt[s.num]; openForm=null; pendingRender=false; toast("Guardado. Pasa a OSE en la próxima sincronización."); build(); render();
    }catch(er){save.disabled=false;save.textContent="Guardar";err.textContent=er&&er.code==="invalid_argument"?"No tienes permiso para guardar. Pide a Eva acceso de colaboradora.":"No se ha guardado ("+(er.code||"error")+"). Vuelve a intentarlo.";err.hidden=false;}
  });
}

function setSync(){
  const el=$("#sync");
  if(!db){el.textContent="Sin conexión";return;}
  el.textContent=estado?.ultimaSync?"OSE sincronizado "+estado.ultimaSync.slice(8,10)+"/"+estado.ultimaSync.slice(5,7)+" "+estado.ultimaSync.slice(11,16):"Pendiente de sincronizar con OSE";
}

if(me) document.querySelectorAll(".chip[data-who]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.who===me)));
render();
(async()=>{try{const f=window.claude&&window.claude.use?await window.claude.use("sample"):null;if(f){sampleFn=f;if(!openForm)render();}}catch(e){}})();
(async()=>{
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){db=null;}
  if(!db){ready.s=true;render();setSync();return;}
  const timer=setTimeout(()=>{if(!ready.s){ready.s=true;render();}},10000);
  const refresh=()=>{build();if(openForm){pendingRender=true;}else render();};
  let gotCasos=false,gotSnap=false;
  db.collection("socias").limit(1000).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]={...d.data(),num:d.id});casos=m;gotCasos=true;if(gotSnap){clearTimeout(timer);ready.s=true;}refresh();},err=>{clearTimeout(timer);ready.s=true;render();toast("No se pudo leer el listado ("+err.code+")");});
  db.collection("snapshots").orderBy("fecha","desc").limit(3).onSnapshot(q=>{const docs=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.id.localeCompare(a.id));snap=docs[0]||null;gotSnap=true;if(gotCasos){clearTimeout(timer);ready.s=true;}refresh();},()=>{gotSnap=true;});
  db.collection("informes").orderBy("fecha","desc").limit(30).onSnapshot(q=>{informes=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.id.localeCompare(a.id));estado=informes[0]?{ultimaSync:informes[0].fecha+"T"+informes[0].hora,totalSocias:informes[0].totalSocias}:estado;setSync();if(route()==="informe"&&!openForm)render();},()=>{});
  db.collection("mensajes").orderBy("escrito","desc").limit(1000).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const v=d.data();m[d.id]={texto:v.texto,textoCa:v.textoCa||""};});mensajes=m;if(!openForm&&!document.activeElement?.dataset?.msg)render();},()=>{});
  db.collection("vueltas").where("vueltaFecha",">=",iso(new Date(Date.now()-90*86400000))).limit(1000).onSnapshot(q=>{vueltas=q.docs.map(d=>d.data());if(route()==="informe"&&!openForm)render();},()=>{});
  db.collection("riesgos").where("estado","==","pendiente").limit(200).onSnapshot(q=>{riesgos=q.docs.map(d=>({...d.data(),id:d.id}));if(route()==="hoy"&&!openForm&&!buscar.trim())render();},()=>{});
  const desde=iso(new Date(Date.now()-60*86400000));
  db.collection("gestiones").where("dia",">=",desde).orderBy("dia","desc").limit(1000).onSnapshot(snap=>{gestiones=snap.docs.map(d=>({...d.data(),id:d.id}));ready.g=true;if(!openForm)render();},()=>{});

})();
})();
</script>
